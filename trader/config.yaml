# Galao System Configuration
# All tunables live here. Never hardcode values in Python files.

ib:
  gateway_log_dir: ""   # optional: IB Gateway log dir, e.g. C:\Jts\username
  live_host: 127.0.0.1
  live_port: 4001  # separate live gateway — data reads only, never used for order placement (see broker.py/decider.py: all orders route through ibc.paper)
  live_client_ids: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
  paper_host: 127.0.0.1
  paper_port: 4002
  paper_client_ids: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210]
  reconnect_interval_seconds: 30
  connection_timeout: 5
  fetcher_client_ids: [801, 802, 803]
  ibc_startgateway_bat: "C:\\IBC\\StartGateway.bat"
  ibc_mode: paper

symbols:
  # Expanded 2026-09-06/07 for the two-winning-reasons research experiment (see
  # trader/scripts/prep_research_lines*.py and RESEARCH_RUNBOOK_2026-09-07.md).
  # Was [MES] only originally -- backup at config.yaml.bak_20260906.
  #
  # 2026-09-09: scaled up from the 10-stock first-session set to 30, picked for
  # liquidity/fast fills from the ~90-symbol candidate pool that has armed lines
  # (a judgment call, not ranked against a live volume feed -- swap freely).
  # Their critical_lines rows are dated 2026-09-08 (no fresher research lines
  # existed at scale-up time) -- known, accepted tradeoff, not an oversight.
  # JPM and BRK.B still skipped (JPM: no armed line; BRK.B: IB dotted-class-share
  # ticker quirk).
  - MES
  - MNQ
  - MYM
  - M2K
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - META
  - AVGO
  - TSLA
  - LLY
  - V
  - BAC
  - WFC
  - AMD
  - CSCO
  - XOM
  - MU
  - QCOM
  - KO
  - PG
  - JNJ
  - UNH
  - HD
  - GS
  - MA
  - TXN
  - VZ
  - SCHW
  - GE
  - MO
  - CVX                # trading symbols only — used by decider, broker, position_manager

fetcher:
  auto_fetch_enabled: true
  fetch_bid_ask: true
  fetch_on_startup: true        # fetch prev day if missing when runner starts
  symbols_override:             # data symbols — independent of trading symbols
    - MES
    - MNQ
    - MYM
  trigger_time_ct: "17:30"      # HH:MM CT — trigger after market close

session:
  open_offset_minutes: 30
  # 2026-09-10: user decision -- start trading 30 min after the real open (17:00 IL, not
  # the 16:30 IL open itself) until pre-market trading is added. 0 = trade at the open.
  trading_start_delay_minutes: 30
  shutdown_offset_minutes: 60
  timezone: America/Chicago
  monitor_poll_seconds: 5          # session.py: how often to check broker/decider liveness
  max_restarts: 5                  # session.py: give up restarting a component after this many crashes
  restart_backoff_base_seconds: 5  # session.py: delay before first restart attempt
  restart_backoff_cap_seconds: 60  # session.py: backoff doubles per crash, capped here
  stop_grace_seconds: 20           # session.py: how long to wait for clean SESSION=SHUTDOWN exit before kill()

orders:
  # Changed 2026-09-06 from [2, 4] for the two-winning-reasons research experiment --
  # backtesting found no reason to trade brackets 1-2 (see summarize_sweep.py sweep).
  # 2026-09-09: dropped 32 -- decided to standardize on [4, 8, 16] going forward.
  active_brackets: [4, 8, 16]
  quantity: 1
  tick_size: 0.25
  # 2026-09-09: broker.py admission gates (process_pending_commands), added after the
  # 2026-09-08 order-storm incident -- see REBUILD_PLAN_2026-09-09.md Phase 1.
  max_resting_per_side: 10        # stay under IB's own ~15-per-contract-per-side cap
                                   # 2026-09-10: applies to geva_manual too now -- its prior
                                   # exemption let real exposure quietly compound across days
                                   # (12 lines 09-09 + 16 more 09-10) until IB itself rejected
                                   # orders outright (45 resting legs/side, a real incident).
                                   # It still gets first priority when capacity exists.
  min_entry_buffer_ticks: 8       # refuse a submit whose entry is closer than this to
                                   # the fresh live price (in ticks, so it scales per symbol)
  # 2026-09-10: control-group lines (geva_manual_control, research_random*) fan out to
  # only this bracket instead of active_brackets -- cuts control volume to a third with
  # no loss to the real-vs-control comparison (user decision). See decider.py _CONTROL_SOURCES.
  control_active_brackets: [4]

position:
  stagnation_seconds: 300
  stagnation_min_move_points: 0.5
  sl_cooldown_seconds: 30

shutdown:
  exit_patience_seconds: 30
  panic_threshold_minutes: 10

decider:
  # 2026-09-07: was raised to 300 for the (since scaled back) 104-symbol universe.
  # 2026-09-09: scaled back up to 34 symbols (4 futures + 30 stocks) -- at the same
  # ~1.5s/price-fetch that's ~51s/pass, so the previous 30s no longer fits (would
  # mean a pass never actually finishes before the next one is due). Raised to 90s.
  replenishment_poll_seconds: 90

broker:
  command_poll_seconds: 5
  ib_poll_seconds: 30

visualizer:
  host: 0.0.0.0      # listen on all interfaces — allows access from other devices on LAN
  port: 5001

paths:
  db: data/galao.db
  test_db: data/test_galao.db
  backtest_db: data/backtest.db
  bars: data/bars.db          # 30m bars, read-only for algo_lab/correlation_lab
  critical_lines: data/critical_lines
  history: data/history
  cl_algo_history: C:\Projects\CriticalCorallations2026\june\trader\data\history  # real tick CSVs live here (bug 6) -- NOT trader/data/history
  logs: logs
  versions: versions

generator:
  n_timestamps: 10
  bracket_sizes: [2, 4, 8, 16]
  entry_offset_min: 0.5
  entry_offset_max: 2.0

grader:
  match_ticks: 1

backtest:
  symbol: MES

# ── Algo Lab ─────────────────────────────────────────────────────────────────
# "Claude-designed algo for sup/res": submits many (strategy x tp/sl x
# direction_filter x strength_max) paper trades in one batch over whatever
# critical_lines already exist (any detection method — manual/ohlc/pivot/
# overnight/orb/vwap/volume/round), tagged source='algo_lab' so P&L can be
# broken down per exact combo later (lib/algo_pnl.py). Paper only — writes
# PENDING rows into `commands`, same DB/broker as everything else, no separate
# IB connection. Scoped to its own `symbols` list, independent of the
# top-level `symbols:` (decider/broker's single-symbol MES flow, unchanged).
algo_lab:
  enabled: true
  symbols: [MES, MNQ, MYM, M2K]
  quantity: 1
  # Trade strategy (lib/algo_engine.AlgoType) — which side(s) of each line to trade
  strategies: [BOUNCE, BREAKOUT, DIRECTIONAL, FADE, BOTH]
  tp_ticks: [4, 8, 16]
  sl_ticks: [4, 8, 16]
  direction_filters: [ALL, BUY_ONLY, SELL_ONLY]
  strength_max: [1, 2, 3]           # 1=strong lines only, 2=+medium, 3=all
  # Full grid above = 5x3x3x3x3 = 405 combos/symbol — way too many resting
  # orders even in paper. Deterministically downsampled to this many per
  # symbol per submit (same subset every time so P&L-by-params stays
  # meaningful across repeated runs, see lib/algo_lab.build_param_grid).
  max_param_combos: 24
  # Hard safety valve on total commands inserted in one submit_grid() call,
  # across all symbols/combos combined.
  max_commands_per_submit: 500

# ── Correlation Lab ────────────────────────────────────────────────────────────
# Read-only exploration module (lib/correlation_lab.py) — rolling pairwise
# correlation across the 4 symbols from trader/data/bars.db. Does not trade;
# purely a visualization aid for the Correlation dashboard tab, meant to
# surface ideas for a future correlation-based algo type. MNQ is not yet
# backfilled into bars.db as of this writing — the module reports it as
# "missing" rather than erroring; see scripts/backfill_bars.py.
correlation:
  symbols: [MES, MNQ, MYM, M2K]
  windows: [20, 50, 100]           # rolling window choices offered in the UI, in 30m bars
  default_window: 50
  max_series_points: 500           # cap on rolling-correlation-over-time chart points

# ── Correlation Trading (Part 2 of the comparison-engine build cycle) ──────────
# The actual live algorithm (trader/correlation_signal.py + correlation_trail.py) --
# distinct from the read-only correlation: block above. Geva's laggard/breakout-
# retest rule (Galgo2029/knowledge/Claims/correlation-trading.md, AI-26-AI-34,
# DQ-005), price/bar-based (no DOM subscription). disabled by default: this is
# a brand-new, not-yet-validated signal source -- turn on deliberately, then
# judge it through the comparison engine (Part 1) like every other algorithm,
# not by eye.
correlation_trading:
  enabled: false
  trail_ticks: 3                   # AI-31 "very tight trailing stop", see correlation_trail.py

# ── Spread Trading (Part 3 of the comparison-engine build cycle) ───────────────
# Geva's DIFF method (Galgo2029/knowledge/Claims/spread-diff-trading.md, AI-35-
# AI-35g): 1 long + 1 short leg, hedged, NO per-leg stop-loss -- the hedge
# itself bounds risk (trader/spread_manager.py, lib/spread_diff.py,
# lib/order_builder_spread.py). disabled by default, same posture as
# correlation_trading above -- a brand-new, not-yet-validated signal source.
#
# AI-35a's leg-direction text ("the instrument that moved MORE -> LONG it")
# reads ambiguous against plain mean-reversion logic without the source lesson
# to resolve it -- 2026-09-11 decision: run BOTH readings simultaneously,
# tagged separately (source='spread' = literal AI-35a text, 'spread_control' =
# the reversed/mean-reversion reading), and let the comparison engine (Part 1)
# judge which one is actually right, instead of guessing.
spread:
  enabled: false
  kill_switch_usd: 500             # portfolio kill-switch: flattens both legs of a
                                    # spread_group_id if its combined open loss crosses this
  gap_multiplier: 1.75             # AI-35c's "1.5-2x average daily gap swing" entry trigger
  max_contract_ratio_denominator: 6  # AI-35d contract-ratio simplification bound
